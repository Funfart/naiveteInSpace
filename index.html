<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naivete&copy; At Space</title>

<style>
html,body {
  margin:0; padding:0; background:#000;
  display:flex; justify-content:center; align-items:center;
  height:100vh; overflow:hidden;
}
#globeWrapper {
  position:relative;
  width:90vw; max-width:500px;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
}
canvas { width:100%; height:100%; }

#intro {
  position:absolute;
  width:100%; height:100%;
  background:#000;
  z-index:10;
}
#intro img {
  width:100%; height:100%;
  object-fit:cover;
}
</style>
</head>

<body>
<div id="globeWrapper">
  <canvas id="c"></canvas>
  <div id="intro"><img id="introGif"></div>
</div>

<script>
// ===== CONFIG =====
const IPFS="https://ipfs.io/ipfs/";
const PARTICLES=25;

// ===== CIDS =====
const CIDS={
 bg:"bafybeihdeirhiybfz5yxkd3spiwlzrodxbi7aivkfqbtl3bvdzfopgru2q",
 intro:"bafybeidohj2juenwic5lt7cy52qnp42wjd26dm7iazvvod5upozntb2gda",
 obj:"bafybeifxr6c7wc72fassxelyryefnn6qjkzhxs2o6crcvplxfkdor55d5i",
 floaters:[
  "bafkreiafiitajgilcavkk73fegtp63tybg46bjuflskvngc5huenv7ksyi",
  "bafkreialn7dtaawuo75gzxv5lsdof7xj3mfydyda2cjalsknv4hayvb4im",
  "bafkreidbsk5yxasjpgloddhcmcurfyynszfkivnqque53pmvzggtbe2fc4",
  "bafkreiasqyc6fbscwk3nmmwznkkxjrduvvk4eyepmk5aro4mdaxpe6h5ze"
 ]
};

// ===== CANVAS =====
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W,H,CX,CY,R,time=0;

function resize(){
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W; canvas.height=H;
 CX=W/2; CY=H/2; R=W/2-10;
}
window.addEventListener("resize",resize);

// ===== LOAD =====
function img(cid){let i=new Image();i.src=IPFS+cid;return i;}
const bg=img(CIDS.bg);
const objImg=img(CIDS.obj);
const floaterImgs=CIDS.floaters.map(img);

const introImg=document.getElementById("introGif");
introImg.src=IPFS+CIDS.intro;

// FIXED intro timing
let introReady=false;
introImg.onload=()=>{ introReady=true; };

// ===== GRAVITY WELLS =====
let wells=[];
canvas.addEventListener("pointerdown",e=>{
 let r=canvas.getBoundingClientRect();
 wells.push({
  x:e.clientX-r.left,
  y:e.clientY-r.top,
  life:1
 });
});

// ===== ORBIT FORCE =====
function applyOrbit(obj,w){
 let dx=w.x-obj.x, dy=w.y-obj.y;
 let d=Math.hypot(dx,dy)+0.1;

 // pull
 let pull=0.3/d;
 obj.vx+=dx/d*pull;
 obj.vy+=dy/d*pull;

 // tangent (orbit)
 let tx=-dy/d, ty=dx/d;
 let orbit=0.4/d;
 obj.vx+=tx*orbit;
 obj.vy+=ty*orbit;
}

// ===== FLOATERS =====
class Floater{
 constructor(img,depth){
  this.img=img;
  this.depth=depth;
  this.reset();
 }
 reset(){
  let a=Math.random()*Math.PI*2;
  let r=Math.random()*R;
  this.x=CX+Math.cos(a)*r;
  this.y=CY+Math.sin(a)*r;
  this.vx=(Math.random()-0.5)*0.6;
  this.vy=(Math.random()-0.5)*0.6;
  this.size=(30+Math.random()*40)*this.depth;
 }
 update(){
  wells.forEach(w=>applyOrbit(this,w));

  // drift noise
  this.vx+=Math.sin(time+this.x*0.01)*0.002;
  this.vy+=Math.cos(time+this.y*0.01)*0.002;

  this.x+=this.vx;
  this.y+=this.vy;

  let dx=this.x-CX, dy=this.y-CY;
  if(Math.hypot(dx,dy)>R-this.size/2){
   this.vx*=-1; this.vy*=-1;
  }

  this.vx*=0.995;
  this.vy*=0.995;
 }
 draw(){
  ctx.globalAlpha=0.5+this.depth*0.5;
  ctx.drawImage(this.img,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
  ctx.globalAlpha=1;
 }
}

// ===== PARTICLES =====
class Particle{
 constructor(){this.reset();}
 reset(){
  let a=Math.random()*Math.PI*2;
  let r=Math.random()*R;
  this.x=CX+Math.cos(a)*r;
  this.y=CY+Math.sin(a)*r;
  this.vx=(Math.random()-0.5);
  this.vy=(Math.random()-0.5);
 }
 update(){
  wells.forEach(w=>applyOrbit(this,w));

  this.x+=this.vx;
  this.y+=this.vy;

  if(Math.hypot(this.x-CX,this.y-CY)>R){
   this.vx*=-1; this.vy*=-1;
  }

  this.vx*=0.99; this.vy*=0.99;
 }
 draw(){
  ctx.fillStyle="#fff";
  ctx.fillRect(this.x,this.y,2,2);
 }
}

// ===== MAIN OBJECT =====
let obj={
 x:0,y:0,vx:0.4,vy:-0.3,size:200,
 update(){
  wells.forEach(w=>applyOrbit(this,w));

  this.vx+=Math.sin(time)*0.002;
  this.vy+=Math.cos(time)*0.002;

  this.x+=this.vx;
  this.y+=this.vy;

  if(Math.hypot(this.x-CX,this.y-CY)>R-this.size/2){
   this.vx*=-1; this.vy*=-1;
  }

  this.vx*=0.995;
  this.vy*=0.995;
 },
 draw(){
  ctx.drawImage(objImg,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
 }
};

// ===== NEBULA (ANIMATED SHADER) =====
function drawNebula(){
 ctx.globalCompositeOperation="lighter";

 let g=ctx.createRadialGradient(
  CX+Math.sin(time*0.5)*50,
  CY+Math.cos(time*0.4)*50,
  20,
  CX,CY,R
 );

 g.addColorStop(0,"rgba(120,0,255,0.15)");
 g.addColorStop(0.5,"rgba(0,200,255,0.1)");
 g.addColorStop(1,"rgba(0,0,0,0)");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.globalCompositeOperation="source-over";
}

// ===== INIT =====
let floaters=[],particles=[];
function init(){
 resize();

 obj.x=CX; obj.y=CY;

 for(let i=0;i<6;i++){
  floaters.push(new Floater(floaterImgs[i%4],0.4));
  floaters.push(new Floater(floaterImgs[i%4],0.8));
  floaters.push(new Floater(floaterImgs[i%4],1.2));
 }

 for(let i=0;i<PARTICLES;i++) particles.push(new Particle());

 loop();
}

// ===== LOOP =====
function loop(){
 time+=0.01;

 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.beginPath();
 ctx.arc(CX,CY,R,0,Math.PI*2);
 ctx.clip();

 ctx.drawImage(bg,0,0,W,H);

 floaters.sort((a,b)=>a.depth-b.depth);
 floaters.forEach(f=>{f.update();f.draw();});

 obj.update(); obj.draw();
 particles.forEach(p=>{p.update();p.draw();});

 drawNebula();

 ctx.restore();

 wells.forEach(w=>w.life-=0.01);
 wells=wells.filter(w=>w.life>0);

 requestAnimationFrame(loop);
}

// ===== INTRO FIXED =====
// ===== INTRO (FULLY FIXED) =====
const introContainer = document.getElementById("intro");
const introImgEl = document.getElementById("introGif");

let introShown = false;
let introStartTime = 0;

function startApp(){
  introContainer.style.display = "none";
  init();
}

function showIntroWhenReady(){
  introStartTime = performance.now();
  introContainer.style.display = "block";

  // Ensure at least 3 seconds AFTER visible render
  function waitMinimumTime(){
    let elapsed = performance.now() - introStartTime;
    let remaining = Math.max(0, 3000 - elapsed);
    setTimeout(startApp, remaining);
  }

  waitMinimumTime();
}

// Robust image readiness check
function loadIntro(){
  return new Promise((resolve)=>{
    if (introImgEl.complete && introImgEl.naturalWidth > 0){
      resolve();
    } else {
      introImgEl.onload = resolve;
      introImgEl.onerror = resolve; // fallback anyway
    }
  });
}

// Extra decode safety (modern browsers)
async function prepareIntro(){
  await loadIntro();

  if (introImgEl.decode){
    try { await introImgEl.decode(); }
    catch(e){}
  }

  // Small delay to ensure paint
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      showIntroWhenReady();
    });
  });
}

// INIT FLOW
window.addEventListener("load", ()=>{
  prepareIntro();
});
</script>
</body>
</html>
