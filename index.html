<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naivete At Space</title>

<style>
html,body {
  margin:0; padding:0; background:#000;
  display:flex; justify-content:center; align-items:center;
  height:100vh; overflow:hidden;
  touch-action:none;
}
#globeWrapper {
  position:relative;
  width:90vw; max-width:500px;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
  border:10px solid rgba(255,255,255,0.4);
  box-shadow:0 0 40px rgba(255,255,255,0.3) inset;
}
canvas { width:100%; height:100%; display:block; }

#intro {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  display:flex; justify-content:center; align-items:center;
  background:#000;
  z-index:5;
}
#intro img {
  width:100%; height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<div id="globeWrapper">
  <canvas id="globeCanvas"></canvas>

  <!-- INTRO SCREEN -->
  <div id="intro">
    <img id="introGif">
  </div>
</div>

<script>
// ================= CONFIG =================
const PARTICLE_COUNT = 12;
const SWIPE_FORCE = 2.5;
const ZERO_GRAVITY = 0.0;

// ================= IPFS =================
const IPFS = "https://ipfs.io/ipfs/";

const CIDS = {
  bg: "bafybeihdeirhiybfz5yxkd3spiwlzrodxbi7aivkfqbtl3bvdzfopgru2q",
  intro: "bafybeidohj2juenwic5lt7cy52qnp42wjd26dm7iazvvod5upozntb2gda",
  obj: "bafybeifxr6c7wc72fassxelyryefnn6qjkzhxs2o6crcvplxfkdor55d5i",

  floaters: [
    "bafkreiafiitajgilcavkk73fegtp63tybg46bjuflskvngc5huenv7ksyi",
    "bafkreialn7dtaawuo75gzxv5lsdof7xj3mfydyda2cjalsknv4hayvb4im",
    "bafkreidbsk5yxasjpgloddhcmcurfyynszfkivnqque53pmvzggtbe2fc4",
    "bafkreiasqyc6fbscwk3nmmwznkkxjrduvvk4eyepmk5aro4mdaxpe6h5ze"
  ]
};

// ================= CANVAS =================
const canvas = document.getElementById("globeCanvas");
const ctx = canvas.getContext("2d");

let W,H,CX,CY,globeRadius;

function resizeCanvas(){
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W;
  canvas.height = H;

  CX = W/2;
  CY = H/2;
  globeRadius = W/2 - 10;
}
window.addEventListener("resize", resizeCanvas);

// ================= LOAD IMAGES =================
function loadImg(cid){
  const img = new Image();
  img.src = IPFS + cid;
  return img;
}

const bgImg = loadImg(CIDS.bg);
const objImg = loadImg(CIDS.obj);
const introImg = document.getElementById("introGif");
introImg.src = IPFS + CIDS.intro;

const floaterImgs = CIDS.floaters.map(loadImg);

// ================= FLOATERS =================
class Floater{
  constructor(img){
    this.img = img;
    this.reset();
  }
  reset(){
    let angle = Math.random()*Math.PI*2;
    let r = Math.random()*globeRadius*0.8;
    this.x = CX + Math.cos(angle)*r;
    this.y = CY + Math.sin(angle)*r;

    this.vx = (Math.random()-0.5)*0.5;
    this.vy = (Math.random()-0.5)*0.5;

    this.size = 30 + Math.random()*40;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;

    // bounce inside globe
    let dx=this.x-CX, dy=this.y-CY;
    let d=Math.hypot(dx,dy);
    let max=globeRadius - this.size/2;

    if(d>max){
      let nx=dx/d, ny=dy/d;
      this.vx -= 2*(this.vx*nx)*nx;
      this.vy -= 2*(this.vy*ny)*ny;
    }
  }
  draw(){
    ctx.drawImage(this.img,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
  }
}

let floaters = [];

// ================= PARTICLES =================
class Particle{
  constructor(){ this.reset(); }
  reset(){
    let a=Math.random()*Math.PI*2;
    let r=Math.random()*globeRadius;
    this.x=CX+Math.cos(a)*r;
    this.y=CY+Math.sin(a)*r;
    this.vx=(Math.random()-0.5)*0.5;
    this.vy=(Math.random()-0.5)*0.5;
    this.size=1+Math.random()*2;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;

    let dx=this.x-CX, dy=this.y-CY;
    let d=Math.hypot(dx,dy);
    if(d>globeRadius){
      this.vx*=-1;
      this.vy*=-1;
    }
  }
  draw(){
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

let particles = [];

// ================= OBJECT =================
let obj = {
  x:0,y:0,vx:0,vy:0,size:200,
  update(){
    this.x+=this.vx;
    this.y+=this.vy;

    let dx=this.x-CX, dy=this.y-CY;
    let d=Math.hypot(dx,dy);
    let max=globeRadius - this.size/2;

    if(d>max){
      let nx=dx/d, ny=dy/d;
      this.vx -= 2*(this.vx*nx)*nx;
      this.vy -= 2*(this.vy*ny)*ny;
    }

    this.vx*=0.99;
    this.vy*=0.99;
  },
  draw(){
    ctx.drawImage(objImg,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
  }
};

// ================= INTERACTION =================
canvas.addEventListener("pointermove", e=>{
  if(e.buttons){
    let dx=(Math.random()-0.5)*SWIPE_FORCE;
    let dy=(Math.random()-0.5)*SWIPE_FORCE;

    obj.vx+=dx;
    obj.vy+=dy;

    particles.forEach(p=>{
      p.vx+=dx;
      p.vy+=dy;
    });
  }
});

// ================= LOOP =================
function loop(){
  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(CX,CY,globeRadius,0,Math.PI*2);
  ctx.clip();

  // BG
  ctx.drawImage(bgImg,0,0,W,H);

  // FLOATERS (behind)
  floaters.forEach(f=>{ f.update(); f.draw(); });

  // OBJECT
  obj.update();
  obj.draw();

  // PARTICLES
  particles.forEach(p=>{ p.update(); p.draw(); });

  ctx.restore();

  requestAnimationFrame(loop);
}

// ================= INIT =================
function init(){
  resizeCanvas();

  obj.x=CX;
  obj.y=CY;

  particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++) particles.push(new Particle());

  floaters = [];
  for(let i=0;i<6;i++){
    let img = floaterImgs[Math.floor(Math.random()*floaterImgs.length)];
    floaters.push(new Floater(img));
  }

  loop();
}

// ================= INTRO =================
window.onload = ()=>{
  setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    init();
  },3000);
};
</script>

</body>
</html>
