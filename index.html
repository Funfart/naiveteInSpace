<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naivete© At Space</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

#globeWrapper{
  position:relative;
  width:90vw;
  max-width:500px;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
}

canvas{ width:100%; height:100%; display:block; }

#intro{
  position:absolute;
  inset:0;
  background:#000;
  z-index:10;
  opacity:0;
  transition:opacity 1.2s ease;
  display:flex;
  justify-content:center;
  align-items:center;
}

#intro.show{opacity:1;}
#intro.fadeOut{opacity:0;}

#intro img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#tapText{
  position:absolute;
  bottom:25px;
  color:white;
  font-family:monospace;
  letter-spacing:3px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}
</style>
</head>

<body>

<div id="globeWrapper">
  <canvas id="c"></canvas>

  <div id="intro">
    <img id="introGif">
    <div id="tapText">TAP TO START</div>
  </div>
</div>

<script>

/* ================= CONFIG ================= */
const IPFS="https://ipfs.io/ipfs/";
const PARTICLES=50;

/* ================= CIDS ================= */
const CIDS={
 bg:"bafkreiezyegilp6dabllq5wrsz5druvljnmxfpojzviqs44klj7aakdiku",
 introStatic:"bafybeic2xdvx27gvvfvlg674duld7codeeqwbudzdfvapqyk74sprlj3ku",
 introGif:"bafybeierjcr724duqjnqxur73vjyqbvqruwymfsmnj56gt3e67ua6j6mqi",
 obj:"bafybeifxr6c7wc72fassxelyryefnn6qjkzhxs2o6crcvplxfkdor55d5i",
 floaters:[
  "bafkreiafiitajgilcavkk73fegtp63tybg46bjuflskvngc5huenv7ksyi",
  "bafkreialn7dtaawuo75gzxv5lsdof7xj3mfydyda2cjalsknv4hayvb4im",
  "bafkreidbsk5yxasjpgloddhcmcurfyynszfkivnqque53pmvzggtbe2fc4",
  "bafkreiasqyc6fbscwk3nmmwznkkxjrduvvk4eyepmk5aro4mdaxpe6h5ze"
 ]
};

/* ================= CANVAS ================= */
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H,CX,CY,R,time=0;

function resize(){
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W;
 canvas.height=H;
 CX=W/2; CY=H/2; R=W/2-10;
}
window.addEventListener("resize",resize);

/* ================= IMAGES ================= */
function img(src){let i=new Image();i.src=src;return i;}
const bg=img(IPFS+CIDS.bg);
const objImg=img(IPFS+CIDS.obj);
const floaterImgs=CIDS.floaters.map(x=>img(IPFS+x));

/* ================= INTRO ================= */
const intro=document.getElementById("intro");
const introImg=document.getElementById("introGif");

introImg.src=IPFS+CIDS.introStatic;

function loadIntro(){
 return new Promise(res=>{
  setTimeout(()=>{
   introImg.src=IPFS+CIDS.introGif;
   introImg.onload=res;
  },800);
 });
}

function fadeIn(){intro.classList.add("show");}
function fadeOut(){
 intro.classList.add("fadeOut");
 setTimeout(()=>{intro.style.display="none";init();},1200);
}

let introDone=false;
intro.addEventListener("pointerdown",()=>{
 if(introDone) return;
 introDone=true;
 fadeOut();
});

async function startIntro(){
 intro.style.display="flex";
 fadeIn();
 await loadIntro();
 setTimeout(()=>{if(!introDone){introDone=true;fadeOut();}},3000);
}

/* ================= GALAXY INFLUENCE ================= */
function galaxyInfluence(o, strength=1){
  let dx=o.x-CX, dy=o.y-CY;
  let d=Math.hypot(dx,dy)+0.001;

  // ONLY tangential swirl (no radial pull = no clustering)
  let tx = -dy/d;
  let ty = dx/d;

  let swirl = 0.003 * strength;

  o.vx += tx * swirl;
  o.vy += ty * swirl;

  // very soft damping (prevents runaway but NOT freezing)
  o.vx *= (1 - 0.0005);
  o.vy *= (1 - 0.0005);
}
/* ================= WELLS ================= */
let wells=[];
canvas.addEventListener("pointerdown",e=>{
 let r=canvas.getBoundingClientRect();
 wells.push({x:e.clientX-r.left,y:e.clientY-r.top,life:1});

 // energy burst
 floaters.forEach(f=>{
   f.vx+=(Math.random()-0.5)*2;
   f.vy+=(Math.random()-0.5)*2;
 });
});

/* ================= ORBIT ================= */
function applyOrbit(o,w){
 let dx=w.x-o.x, dy=w.y-o.y;
 let d=Math.hypot(dx,dy)+0.1;

 let pull=0.4/d;
 o.vx+=dx/d*pull;
 o.vy+=dy/d*pull;

 let tx=-dy/d, ty=dx/d;
 o.vx+=tx*(0.6/d);
 o.vy+=ty*(0.6/d);
}

/* ================= FLOATERS ================= */
class Floater{
 constructor(img,depth){
  this.img=img;
  this.depth=depth;
  this.reset();
 }
 reset(){
  let a=Math.random()*Math.PI*2;
  let r=Math.random()*R*0.8;
  this.x=CX+Math.cos(a)*r;
  this.y=CY+Math.sin(a)*r;
  this.vx=(Math.random()-0.5)*2;
  this.vy=(Math.random()-0.5)*2;
  this.size=(30+Math.random()*40)*this.depth;
 }update(){
  wells.forEach(w=>applyOrbit(this,w));

  // weaker galaxy influence than obj
  galaxyInfluence(this, 0.35);

  // constant motion injection (prevents stalling)
  this.vx += Math.sin(time*0.8 + this.y*0.01) * 0.03;
  this.vy += Math.cos(time*0.8 + this.x*0.01) * 0.03;

  this.x += this.vx;
  this.y += this.vy;

  // border bounce with RANDOMIZED rebound (prevents clustering)
  let dx=this.x-CX, dy=this.y-CY;
  let d=Math.hypot(dx,dy);
  let max=R-this.size/2;

  if(d>max){
    let nx=dx/d, ny=dy/d;

    this.x = CX + nx*max;
    this.y = CY + ny*max;

    let dot=this.vx*nx + this.vy*ny;

    // reflect + chaos injection
    this.vx -= 2*dot*nx;
    this.vy -= 2*dot*ny;

    this.vx += (Math.random()-0.5)*1.2;
    this.vy += (Math.random()-0.5)*1.2;
  }

  // mild damping (not freezing)
  this.vx *= 0.997;
  this.vy *= 0.997;
}
 }
 draw(){
  ctx.globalAlpha=0.4+this.depth*0.6;
  ctx.drawImage(this.img,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
  ctx.globalAlpha=1;
 }
}

/* ================= PARTICLES ================= */
class Particle{
 constructor(){this.reset();}
 reset(){
  let a=Math.random()*Math.PI*2;
  let r=Math.random()*R;
  this.x=CX+Math.cos(a)*r;
  this.y=CY+Math.sin(a)*r;
  this.vx=(Math.random()-0.5)*2;
  this.vy=(Math.random()-0.5)*2;
 }update(){
  wells.forEach(w=>applyOrbit(this,w));

  galaxyInfluence(this, 0.5);

  this.vx += Math.sin(time + this.x*0.02) * 0.02;
  this.vy += Math.cos(time + this.y*0.02) * 0.02;

  this.x += this.vx;
  this.y += this.vy;

  let dx=this.x-CX, dy=this.y-CY;
  let d=Math.hypot(dx,dy);

  if(d>R){
    let nx=dx/d, ny=dy/d;

    this.x = CX + nx*R;
    this.y = CY + ny*R;

    this.vx *= -1;
    this.vy *= -1;

    // anti-cluster jitter
    this.vx += (Math.random()-0.5)*0.8;
    this.vy += (Math.random()-0.5)*0.8;
  }

  this.vx *= 0.998;
  this.vy *= 0.998;
}
}

/* ================= OBJECT ================= */
let obj={
 x:0,y:0,vx:2,vy:-1.5,size:200,
 update(){
  wells.forEach(w=>applyOrbit(this,w));
  galaxyInfluence(this);

  this.vx+=Math.sin(time)*0.03;
  this.vy+=Math.cos(time)*0.03;

  this.x+=this.vx;
  this.y+=this.vy;

  if(Math.hypot(this.x-CX,this.y-CY)>R-this.size/2){
   this.vx*=-1;
   this.vy*=-1;
  }
 },
 draw(){
  ctx.drawImage(objImg,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
 }
};

/* ================= GALAXY ================= */
function drawGalaxy(){
 ctx.globalCompositeOperation="lighter";

 for(let i=0;i<300;i++){
  let arm = i%3;
  let angle = i*0.1 + time*0.3 + arm*2;
  let radius = i*1.2;

  let x=CX+Math.cos(angle)*radius;
  let y=CY+Math.sin(angle)*radius;

  ctx.fillStyle="rgba(255,255,255,0.25)";
  ctx.fillRect(x,y,1.5,1.5);
 }

 ctx.globalCompositeOperation="source-over";
}

/* ================= NEBULA ================= */
function drawNebula(){
 ctx.globalCompositeOperation="lighter";

 let g=ctx.createRadialGradient(
  CX+Math.sin(time*0.5)*60,
  CY+Math.cos(time*0.4)*60,
  20,
  CX,CY,R
 );

 g.addColorStop(0,"rgba(120,0,255,0.2)");
 g.addColorStop(0.5,"rgba(0,200,255,0.15)");
 g.addColorStop(1,"rgba(0,0,0,0)");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.globalCompositeOperation="source-over";
}

/* ================= LOOP ================= */
let floaters=[],particles=[];

function loop(){
 time+=0.01;

 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.beginPath();
 ctx.arc(CX,CY,R,0,Math.PI*2);
 ctx.clip();

 ctx.drawImage(bg,0,0,W,H);

 drawGalaxy();
 drawNebula();

 floaters.sort((a,b)=>a.depth-b.depth);
 floaters.forEach(f=>{f.update();f.draw();});

 obj.update(); obj.draw();

 particles.forEach(p=>{p.update();p.draw();});

 ctx.restore();

 wells.forEach(w=>w.life-=0.01);
 wells=wells.filter(w=>w.life>0);

 requestAnimationFrame(loop);
}

/* ================= INIT ================= */
function init(){
 resize();

 obj.x=CX;
 obj.y=CY;

 floaters=[];
 particles=[];

 for(let i=0;i<6;i++){
  floaters.push(new Floater(floaterImgs[i%4],0.4));
  floaters.push(new Floater(floaterImgs[i%4],0.8));
  floaters.push(new Floater(floaterImgs[i%4],1.2));
 }

 for(let i=0;i<PARTICLES;i++) particles.push(new Particle());

 loop();
}

/* START */
startIntro();

</script>
</body>
</html>
