<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naivete© At Space</title>

<style>
html,body {
  margin:0;
  padding:0;
  background:#000;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* WRAPPER */
#globeWrapper{
  position:relative;
  width:90vw;
  max-width:500px;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
}

/* CANVAS */
canvas{
  width:100%;
  height:100%;
  display:block;
}

/* INTRO */
#intro{
  position:absolute;
  inset:0;
  background:#000;
  z-index:10;
  opacity:0;
  transition:opacity 1.2s ease;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#intro.show{ opacity:1; }
#intro.fadeOut{ opacity:0; }

#intro img{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  top:0; left:0;
}

/* TAP TEXT */
#tapText{
  position:absolute;
  bottom:25px;
  color:white;
  font-family:monospace;
  font-size:14px;
  letter-spacing:3px;
  animation:blink 1s infinite;
  z-index:2;
}

@keyframes blink{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}
</style>
</head>

<body>

<div id="globeWrapper">
  <canvas id="c"></canvas>

  <div id="intro">
    <img id="introGif">
    <div id="tapText">TAP TO START</div>
  </div>
</div>

<script>

/* ================= CONFIG ================= */
const IPFS = "https://ipfs.io/ipfs/";
const PARTICLES = 25;

/* ================= CIDS ================= */
const CIDS = {
 bg:"bafkreiezyegilp6dabllq5wrsz5druvljnmxfpojzviqs44klj7aakdiku",
 introStatic:"bafybeic2xdvx27gvvfvlg674duld7codeeqwbudzdfvapqyk74sprlj3ku",
 introGif:"bafybeierjcr724duqjnqxur73vjyqbvqruwymfsmnj56gt3e67ua6j6mqi",
 obj:"bafybeifxr6c7wc72fassxelyryefnn6qjkzhxs2o6crcvplxfkdor55d5i",
 floaters:[
  "bafkreiafiitajgilcavkk73fegtp63tybg46bjuflskvngc5huenv7ksyi",
  "bafkreialn7dtaawuo75gzxv5lsdof7xj3mfydyda2cjalsknv4hayvb4im",
  "bafkreidbsk5yxasjpgloddhcmcurfyynszfkivnqque53pmvzggtbe2fc4",
  "bafkreiasqyc6fbscwk3nmmwznkkxjrduvvk4eyepmk5aro4mdaxpe6h5ze"
 ]
};

/* ================= CANVAS ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W,H,CX,CY,R,time=0;

function resize(){
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W;
  canvas.height = H;
  CX = W/2;
  CY = H/2;
  R = W/2 - 10;
}
window.addEventListener("resize",resize);

/* ================= LOAD IMAGES ================= */
function img(src){
  const i = new Image();
  i.src = src;
  return i;
}

const bg = img(IPFS + CIDS.bg);
const objImg = img(IPFS + CIDS.obj);
const floaterImgs = CIDS.floaters.map(x=>img(IPFS + x));

/* ================= INTRO ================= */
const intro = document.getElementById("intro");
const introImg = document.getElementById("introGif");

let introState = "static";
let introDone = false;

introImg.src = IPFS + CIDS.introStatic;

/* swap static → gif */
function loadIntro(){
  return new Promise(res=>{
    setTimeout(()=>{
      introImg.src = IPFS + CIDS.introGif;
      introImg.onload = res;
    }, 800);
  });
}

/* fade in */
function fadeIn(){
  intro.classList.add("show");
}

/* fade out */
function fadeOut(){
  intro.classList.add("fadeOut");
  setTimeout(()=>{
    intro.style.display="none";
    init();
  },1200);
}

/* tap to skip/start */
intro.addEventListener("pointerdown",()=>{
  if(introDone) return;
  introDone = true;
  fadeOut();
});

/* intro flow */
async function startIntro(){
  intro.style.display="flex";
  fadeIn();

  await loadIntro();

  setTimeout(()=>{
    if(!introDone){
      introDone = true;
      fadeOut();
    }
  },3000);
}

/* ================= PHYSICS ================= */
let floaters=[],particles=[];

function applyOrbit(obj,w){
  let dx=w.x-obj.x, dy=w.y-obj.y;
  let d=Math.hypot(dx,dy)+0.1;

  let pull=0.3/d;
  obj.vx+=dx/d*pull;
  obj.vy+=dy/d*pull;

  let tx=-dy/d, ty=dx/d;
  let orbit=0.4/d;
  obj.vx+=tx*orbit;
  obj.vy+=ty*orbit;
}

class Floater{
  constructor(img,depth){
    this.img=img;
    this.depth=depth;
    this.reset();
  }
  reset(){
    let a=Math.random()*Math.PI*2;
    let r=Math.random()*R;
    this.x=CX+Math.cos(a)*r;
    this.y=CY+Math.sin(a)*r;
    this.vx=(Math.random()-0.5)*0.6;
    this.vy=(Math.random()-0.5)*0.6;
    this.size=(30+Math.random()*40)*this.depth;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;

    let dx=this.x-CX, dy=this.y-CY;
    if(Math.hypot(dx,dy)>R-this.size/2){
      this.vx*=-1;
      this.vy*=-1;
    }

    this.vx*=0.995;
    this.vy*=0.995;
  }
  draw(){
    ctx.globalAlpha=0.5+this.depth*0.5;
    ctx.drawImage(this.img,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
    ctx.globalAlpha=1;
  }
}

class Particle{
  constructor(){this.reset();}
  reset(){
    let a=Math.random()*Math.PI*2;
    let r=Math.random()*R;
    this.x=CX+Math.cos(a)*r;
    this.y=CY+Math.sin(a)*r;
    this.vx=(Math.random()-0.5);
    this.vy=(Math.random()-0.5);
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vx*=0.99;
    this.vy*=0.99;
  }
  draw(){
    ctx.fillStyle="#fff";
    ctx.fillRect(this.x,this.y,2,2);
  }
}

let obj = {
  x:0,y:0,vx:0.4,vy:-0.3,size:200,
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vx*=0.995;
    this.vy*=0.995;
  },
  draw(){
    ctx.drawImage(objImg,this.x-this.size/2,this.y-this.size/2,this.size,this.size);
  }
};

/* ================= LOOP ================= */
function loop(){
  time+=0.01;

  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.clip();

  ctx.drawImage(bg,0,0,W,H);

  floaters.forEach(f=>{f.update();f.draw();});
  obj.update(); obj.draw();
  particles.forEach(p=>{p.update();p.draw();});

  ctx.restore();

  requestAnimationFrame(loop);
}

/* ================= INIT ================= */
function init(){
  resize();

  obj.x=CX;
  obj.y=CY;

  floaters=[];
  particles=[];

  for(let i=0;i<6;i++){
    floaters.push(new Floater(floaterImgs[i%4],0.4));
    floaters.push(new Floater(floaterImgs[i%4],0.8));
    floaters.push(new Floater(floaterImgs[i%4],1.2));
  }

  for(let i=0;i<PARTICLES;i++) particles.push(new Particle());

  loop();
}

/* START */
startIntro();

</script>

</body>
</html>
